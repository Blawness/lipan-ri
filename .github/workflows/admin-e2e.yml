name: Admin E2E (preview)

# Runs the authenticated admin page-load smoke tests against the Vercel
# *preview* deployment of each push/PR, catching serverless-only failures
# (e.g. a dependency that loads locally but not in Vercel's runtime) before
# they reach production.
#
# Vercel publishes the preview URL via the GitHub `deployment_status` event
# (environment == "Preview", url in environment_url) — no Vercel token needed.
#
# NOTE: GitHub runs the workflow file from the DEFAULT branch for deployment
# events, so this must live on master to take effect.
#
# Required GitHub secrets: E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD (an admin login
# that exists in the DB the preview uses). The Preview env must also have
# AUTH_SECRET set in Vercel.

on:
  deployment_status

permissions:
  contents: read

concurrency:
  group: admin-e2e-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  admin-e2e:
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated admin E2E against the preview URL
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: pnpm exec playwright test --project=admin

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
